<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Votación Escolar</title>

  <style>
    :root{
      --bg:#0b1220;
      --card:#0f1a2e;
      --muted:#9ca3af;
      --text:#e5e7eb;
      --primary:#3b82f6;
      --ok:#22c55e;
      --warn:#f59e0b;
      --danger:#ef4444;
      --border:#22304d;
      --shadow: 0 18px 45px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Arial, "Noto Sans", sans-serif;
      background: radial-gradient(1000px 700px at 20% 0%, #1b2a4a 0%, var(--bg) 60%);
      color: var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 24px 14px;
    }
    .wrap{
      width: 100%;
      max-width: 980px;
      display:grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media(min-width: 900px){
      .wrap{ grid-template-columns: 1.05fr .95fr; }
    }
    .card{
      background: rgba(15,26,46,.92);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 18px;
    }
    .header{
      display:flex;
      align-items:center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .logo{
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(59,130,246,.14);
      border: 1px solid rgba(59,130,246,.35);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: 22px;
      flex: 0 0 auto;
      overflow:hidden;
    }
    .logo img{width:100%; height:100%; object-fit:cover}
    .title h1{
      font-size: 18px;
      margin:0;
      line-height:1.2;
    }
    .title p{
      margin:2px 0 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .section-title{
      font-size: 14px;
      margin: 0 0 10px 0;
      color: #cbd5e1;
      letter-spacing: .2px;
    }

    .row{
      display:flex;
      gap: 10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .field{
      width:100%;
      display:flex;
      flex-direction:column;
      gap: 6px;
      margin-top: 8px;
    }
    label{
      font-size: 12px;
      color: #cbd5e1;
    }
    input{
      width:100%;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.25);
      color: var(--text);
      font-size: 16px;
      outline:none;
    }
    input:focus{
      border-color: rgba(59,130,246,.65);
      box-shadow: 0 0 0 4px rgba(59,130,246,.14);
    }
    .btn{
      width:100%;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: var(--primary);
      color: white;
      font-weight: 700;
      font-size: 15px;
      cursor:pointer;
      transition: .15s;
    }
    .btn:hover{ filter: brightness(1.05); }
    .btn:disabled{
      opacity:.55;
      cursor:not-allowed;
    }
    .btn.secondary{
      background: rgba(148,163,184,.12);
      border-color: rgba(148,163,184,.22);
      color: #e5e7eb;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,.18);
      background: rgba(148,163,184,.08);
      font-size: 13px;
      color: #e5e7eb;
    }
    .pill small{ color: var(--muted); font-weight: 600; }

    .alert{
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(148,163,184,.18);
      background: rgba(148,163,184,.08);
      color: #e5e7eb;
      font-size: 14px;
      display:none;
    }
    .alert.ok{ display:block; border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.12); }
    .alert.warn{ display:block; border-color: rgba(245,158,11,.35); background: rgba(245,158,11,.12); }
    .alert.danger{ display:block; border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.12); }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media(min-width: 520px){
      .grid{ grid-template-columns: 1fr 1fr; }
    }
    .cand{
      border: 1px solid rgba(148,163,184,.18);
      background: rgba(0,0,0,.16);
      padding: 12px;
      border-radius: 14px;
      cursor:pointer;
      transition:.12s;
      user-select:none;
    }
    .cand:hover{
      border-color: rgba(59,130,246,.45);
      transform: translateY(-1px);
    }
    .cand.selected{
      border-color: rgba(59,130,246,.9);
      background: rgba(59,130,246,.12);
    }
    .cand.disabled{
      opacity:.55;
    }
    .cand h3{
      margin:0;
      font-size: 15px;
      line-height:1.2;
    }
    .cand p{
      margin: 6px 0 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .muted{ color: var(--muted); }
    .hr{
      height:1px;
      background: rgba(148,163,184,.14);
      margin: 12px 0;
    }
    .small{
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <!-- CARD 1: INGRESO -->
    <div class="card">
      <div class="header">
        <div class="logo" id="school-logo">🗳️</div>
        <div class="title">
          <h1 id="school-name">Votación Escolar</h1>
          <p id="status-text">Cargando estado…</p>
        </div>
      </div>

      <div class="pill" id="status-pill">
        <span id="status-dot">●</span>
        <small>Estado:</small>
        <span id="status-label">Cargando…</span>
      </div>

      <div class="hr"></div>

      <p class="section-title">1) Ingresa tu código</p>

      <div class="field">
        <label for="access-code">Código (5 dígitos)</label>
        <input id="access-code" type="text" inputmode="numeric" maxlength="5" placeholder="Ej: 06105" />
      </div>

      <div class="row" style="margin-top:10px;">
        <button class="btn" id="btn-verify">Verificar</button>
        <button class="btn secondary" id="btn-clear">Limpiar</button>
      </div>

      <div class="alert" id="verify-alert"></div>

      <div class="hr"></div>

      <p class="section-title">2) Elige un candidato</p>
      <p class="small" id="vote-instructions">
        Primero verifica tu código. Luego selecciona un candidato y confirma tu voto.
      </p>

      <div class="alert" id="vote-alert"></div>
    </div>

    <!-- CARD 2: CANDIDATOS -->
    <div class="card">
      <p class="section-title">Candidatos</p>
      <div class="grid" id="candidates"></div>

      <div class="hr"></div>

      <button class="btn" id="btn-vote" disabled>Confirmar voto</button>

      <p class="small" style="margin-top:10px;">
        <span class="muted">API:</span> <span id="api-url"></span>
      </p>
    </div>
  </div>

  <script>
    // =========================
    // CONFIG
    // =========================
    const API_URL = '/api';
    document.getElementById('api-url').textContent = location.origin + API_URL;

    // =========================
    // STATE
    // =========================
    let electionOpen = false;
    let verifiedStudent = null;
    let verifiedCode = '';
    let selectedCandidateId = null;
    let candidates = [];

    // =========================
    // HELPERS
    // =========================
    const $ = (id) => document.getElementById(id);

    function onlyDigits(str) {
      return String(str || '').replace(/\D+/g, '');
    }

    function isValidCode(code) {
      return /^\d{5}$/.test(code);
    }

    async function fetchJSON(url, options = {}) {
      try {
        const res = await fetch(url, options);
        const data = await res.json().catch(() => null);
        return { ok: res.ok, status: res.status, data };
      } catch (err) {
        return { ok: false, status: 0, data: { error: 'No se pudo conectar con el servidor.' } };
      }
    }

    function showAlert(el, type, msg) {
      el.className = 'alert ' + type;
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideAlert(el) {
      el.className = 'alert';
      el.textContent = '';
      el.style.display = 'none';
    }

    function resetSessionUI() {
      verifiedStudent = null;
      verifiedCode = '';
      selectedCandidateId = null;

      hideAlert($('verify-alert'));
      hideAlert($('vote-alert'));

      $('btn-vote').disabled = true;

      // Limpiar selección
      document.querySelectorAll('.cand').forEach(x => x.classList.remove('selected'));
      document.querySelectorAll('.cand').forEach(x => x.classList.remove('disabled'));
      document.querySelectorAll('.cand').forEach(x => x.style.pointerEvents = 'auto');
    }

    function updateStatusUI() {
      const pill = $('status-pill');
      const dot = $('status-dot');
      const label = $('status-label');

      if (electionOpen) {
        dot.style.color = '#22c55e';
        label.textContent = 'ABIERTA';
        $('status-text').textContent = 'La votación está abierta. Puedes votar.';
      } else {
        dot.style.color = '#ef4444';
        label.textContent = 'CERRADA';
        $('status-text').textContent = 'La votación está cerrada.';
      }
    }

    // =========================
    // LOAD STATUS
    // =========================
    async function loadStatus() {
      const { ok, data } = await fetchJSON(`${API_URL}/check-status`);
      if (!ok) {
        electionOpen = false;
        updateStatusUI();
        return;
      }

      electionOpen = data?.open === true;
      updateStatusUI();

      // Config visual
      if (data?.school_name) $('school-name').textContent = data.school_name;

      if (data?.school_logo) {
        const logoDiv = $('school-logo');
        logoDiv.innerHTML = `<img src="${data.school_logo}" alt="Logo" />`;
      }
    }

    // =========================
    // LOAD CANDIDATES
    // =========================
    async function loadCandidates() {
      const { ok, data } = await fetchJSON(`${API_URL}/get-candidates`);
      if (!ok) {
        $('candidates').innerHTML = `<p class="muted">No se pudieron cargar candidatos.</p>`;
        return;
      }

      candidates = Array.isArray(data?.candidates) ? data.candidates : [];
      renderCandidates();
    }

    function renderCandidates() {
      const container = $('candidates');
      container.innerHTML = '';

      if (!candidates.length) {
        container.innerHTML = `<p class="muted">No hay candidatos registrados.</p>`;
        return;
      }

      candidates.forEach(c => {
        const div = document.createElement('div');
        div.className = 'cand';
        div.dataset.id = c.id;

        div.innerHTML = `
          <h3>${escapeHTML(c.name || '')}</h3>
          <p>${escapeHTML(c.party || '')}</p>
        `;

        div.addEventListener('click', () => {
          if (!verifiedStudent) return;
          if (!electionOpen) return;

          document.querySelectorAll('.cand').forEach(x => x.classList.remove('selected'));
          div.classList.add('selected');
          selectedCandidateId = c.id;

          $('btn-vote').disabled = false;
          $('vote-instructions').textContent = 'Seleccionaste un candidato. Ahora confirma tu voto.';
        });

        container.appendChild(div);
      });
    }

    function escapeHTML(str) {
      return String(str || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    // =========================
    // VERIFY CODE
    // =========================
    async function verifyCode() {
      hideAlert($('verify-alert'));
      hideAlert($('vote-alert'));

      if (!electionOpen) {
        showAlert($('verify-alert'), 'warn', 'La votación está cerrada. No puedes votar ahora.');
        return;
      }

      const code = onlyDigits($('access-code').value).slice(0, 5);
      $('access-code').value = code;

      if (!isValidCode(code)) {
        showAlert($('verify-alert'), 'warn', 'El código debe tener 5 dígitos.');
        return;
      }

      $('btn-verify').disabled = true;
      $('btn-verify').textContent = 'Verificando…';

      const { ok, data } = await fetchJSON(`${API_URL}/verify-code`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ access_code: code })
      });

      $('btn-verify').textContent = 'Verificar';
      $('btn-verify').disabled = false;

      if (!ok) {
        const msg = data?.error || 'Código inválido.';
        showAlert($('verify-alert'), 'danger', msg);
        resetSessionUI();
        return;
      }

      verifiedStudent = data.student;
      verifiedCode = code;

      showAlert($('verify-alert'), 'ok', `✅ Código válido: ${verifiedStudent.name} (Grado ${verifiedStudent.grade} - Curso ${verifiedStudent.course})`);
      $('vote-instructions').textContent = 'Ahora selecciona un candidato y presiona “Confirmar voto”.';
    }

    // =========================
    // CAST VOTE
    // =========================
    async function castVote() {
      hideAlert($('vote-alert'));

      if (!electionOpen) {
        showAlert($('vote-alert'), 'warn', 'La votación está cerrada. No puedes votar ahora.');
        return;
      }
      if (!verifiedStudent || !isValidCode(verifiedCode)) {
        showAlert($('vote-alert'), 'warn', 'Primero verifica tu código.');
        return;
      }
      if (!selectedCandidateId) {
        showAlert($('vote-alert'), 'warn', 'Selecciona un candidato.');
        return;
      }

      const confirmMsg = `¿Confirmas tu voto?\n\nEstudiante: ${verifiedStudent.name}\nGrado: ${verifiedStudent.grade}  Curso: ${verifiedStudent.course}\n`;
      if (!confirm(confirmMsg)) return;

      $('btn-vote').disabled = true;
      $('btn-vote').textContent = 'Enviando…';

      const { ok, data } = await fetchJSON(`${API_URL}/cast-vote`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ access_code: verifiedCode, candidate_id: selectedCandidateId })
      });

      $('btn-vote').textContent = 'Confirmar voto';

      if (!ok) {
        const msg = data?.error || 'No se pudo registrar el voto.';
        showAlert($('vote-alert'), 'danger', msg);
        $('btn-vote').disabled = false;
        return;
      }

      // ==========================================================
      // ✅ MEJORA (PUNTO 1):
      // Después de votar, dejamos la pantalla lista para el siguiente
      // estudiante SIN refrescar.
      // ==========================================================
      showAlert($('vote-alert'), 'ok', '✅ Voto registrado correctamente. ¡Gracias por participar!');

      // Bloquear temporalmente mientras se muestra el mensaje
      $('btn-vote').disabled = true;
      $('btn-verify').disabled = true;
      $('access-code').disabled = true;

      document.querySelectorAll('.cand').forEach(x => x.classList.add('disabled'));
      document.querySelectorAll('.cand').forEach(x => x.style.pointerEvents = 'none');

      // Reset automático para el siguiente estudiante
      setTimeout(() => {
        $('access-code').value = '';
        $('access-code').disabled = false;
        $('btn-verify').disabled = false;
        $('btn-verify').textContent = 'Verificar';
        resetSessionUI();
        $('vote-instructions').textContent = 'Primero verifica tu código. Luego selecciona un candidato y confirma tu voto.';
        $('access-code').focus();
      }, 1800);
    }

    // =========================
    // EVENTS
    // =========================
    $('btn-verify').addEventListener('click', verifyCode);
    $('btn-vote').addEventListener('click', castVote);

    $('btn-clear').addEventListener('click', () => {
      $('access-code').value = '';
      $('access-code').disabled = false;
      $('btn-verify').disabled = false;
      $('btn-verify').textContent = 'Verificar';
      resetSessionUI();
      $('vote-instructions').textContent = 'Primero verifica tu código. Luego selecciona un candidato y confirma tu voto.';
    });

    $('access-code').addEventListener('input', () => {
      const cleaned = onlyDigits($('access-code').value).slice(0, 5);
      if ($('access-code').value !== cleaned) $('access-code').value = cleaned;
    });

    $('access-code').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') verifyCode();
    });

    // =========================
    // INIT
    // =========================
    (async function init(){
      resetSessionUI();
      await loadStatus();
      await loadCandidates();

      // Auto-refresh del estado cada 10s (si cambia en admin)
      setInterval(loadStatus, 10000);
    })();
  </script>
</body>
</html>
